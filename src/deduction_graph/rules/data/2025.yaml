    amount: 2500
    source: "IRC 221(b)(1); Pub 970 (2025)"
    verified: false
  phase_out:
    single:
      start: 85000
      end: 100000
      source: "Pub 970 (2025)"
      verified: false
    head_of_household:
      start: 85000
      end: 100000
      source: "Pub 970 (2025)"
      verified: false
    married_filing_jointly:
      start: 170000
      end: 200000
      source: "Pub 970 (2025)"
      verified: false
    qualifying_surviving_spouse:
      start: 170000
      end: 200000
      source: "Pub 970 (2025)"
      verified: false
    married_filing_separately:
      ineligible: true
      source: "IRC 221(e)(2); Pub 970 (2025)"
      verified: false

hsa:
